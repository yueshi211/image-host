<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Image Host</title>
  <style>
    :root {
      --bg: #090b0a;
      --surface: #111512;
      --surface-2: #182019;
      --line: #2b352d;
      --text: #f1f5f2;
      --muted: #9aa59d;
      --green: #54d27b;
      --green-dark: #173b24;
      --danger: #ff6b6b;
      --warning: #f4c95d;
      --radius: 8px;
      --shadow: 0 12px 34px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }
    html { min-width: 300px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid #387047; border-radius: 8px; background: var(--green-dark); color: var(--green); }
    h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

    .icon-button, .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      transition: border-color .16s, background .16s, transform .16s;
    }
    .icon-button:hover, .button:hover { border-color: #496151; background: #202a22; }
    .icon-button:active, .button:active { transform: translateY(1px); }
    .icon-button { display: inline-grid; place-items: center; width: 40px; padding: 0; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-weight: 650; }
    .button.primary { border-color: #2b7a43; background: #1e6a37; color: #fff; }
    .button.primary:hover { background: #277d43; }
    .button.danger { color: #ffb3b3; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .token-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 18px; margin-bottom: 18px; }
    .field-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .field-row { display: flex; gap: 10px; }
    .field-row input {
      width: 100%; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius);
      outline: none; background: #0b0e0c; color: var(--text);
    }
    .field-row input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(84, 210, 123, .12); }
    .security-note { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #5f6761; }
    .status-pill.ready { color: #b7f2c8; border-color: #285c38; }
    .status-pill.ready .status-dot { background: var(--green); box-shadow: 0 0 0 4px rgba(84, 210, 123, .12); }

    .upload-panel { padding: 18px; margin-bottom: 26px; }
    .dropzone {
      display: grid; place-items: center; min-height: 230px; padding: 28px; border: 1px dashed #3d5b45; border-radius: var(--radius);
      background: #0d120f; text-align: center; transition: border-color .16s, background .16s;
    }
    .dropzone.dragging { border-color: var(--green); background: #111c14; }
    .drop-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; background: var(--green-dark); color: var(--green); }
    .drop-icon svg { width: 24px; height: 24px; }
    .dropzone h2 { margin: 0 0 7px; font-size: 18px; }
    .dropzone p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    #fileInput { display: none; }
    .queue { display: grid; gap: 10px; margin-top: 14px; }
    .queue-item { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 12px; align-items: center; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #0d100e; }
    .queue-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .progress { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: #252b27; }
    .progress > span { display: block; width: 0; height: 100%; background: var(--green); transition: width .2s; }
    .queue-state { color: var(--muted); font-size: 12px; text-align: right; }

    .gallery-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .gallery-head h2 { margin: 0; font-size: 18px; }
    .gallery-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .preview { display: grid; place-items: center; aspect-ratio: 16 / 10; overflow: hidden; background: #080a09; }
    .preview img { width: 100%; height: 100%; object-fit: contain; }
    .preview.audio { padding: 18px; background: #101813; }
    .preview audio { width: 100%; }
    .card-body { padding: 13px; }
    .filename { margin: 0 0 11px; overflow: hidden; color: #e9efeb; font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .link-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; margin-bottom: 10px; }
    .link-row input { min-width: 0; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: #0b0e0c; color: var(--muted); font-size: 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; }
    .actions .button { min-width: 0; height: 38px; padding: 0 10px; font-size: 12px; }
    .empty { grid-column: 1 / -1; padding: 54px 20px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; background: var(--surface); }

    .toast-stack { position: fixed; z-index: 50; right: 18px; bottom: 18px; display: grid; gap: 10px; width: min(360px, calc(100vw - 36px)); }
    .toast { padding: 12px 14px; border: 1px solid #385341; border-radius: var(--radius); background: #132017; box-shadow: var(--shadow); color: #e8f7ec; font-size: 13px; animation: toast-in .2s ease-out; }
    .toast.error { border-color: #704040; background: #271515; color: #ffd2d2; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    @media (max-width: 860px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 1180px); padding-top: 18px; }
      .token-panel { grid-template-columns: 1fr; align-items: stretch; }
      .field-row { flex-direction: column; }
      .gallery { grid-template-columns: 1fr; }
      .dropzone { min-height: 205px; padding: 22px 16px; }
      .subtitle { max-width: 220px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m21 15-5-5L5 20"></path></svg>
        </div>
        <div>
          <h1>Image Host</h1>
          <p class="subtitle">yueshi211 / image-host</p>
        </div>
      </div>
      <button id="refreshButton" class="icon-button" title="刷新图库" aria-label="刷新图库">
        <svg viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path></svg>
      </button>
    </header>

    <section class="panel token-panel" aria-labelledby="tokenTitle">
      <div>
        <label id="tokenTitle" class="field-label" for="tokenInput">GitHub Personal Access Token</label>
        <div class="field-row">
          <input id="tokenInput" type="password" autocomplete="off" placeholder="ghp_..." aria-describedby="tokenHelp">
          <button id="saveTokenButton" class="button primary" type="button">保存 Token</button>
        </div>
        <p id="tokenHelp" class="security-note">Token 仅保存在本机浏览器的 localStorage，并仅用于访问 api.github.com。</p>
      </div>
      <div id="tokenStatus" class="status-pill"><span class="status-dot"></span><span>未配置</span></div>
    </section>

    <section class="panel upload-panel" aria-labelledby="uploadTitle">
      <div id="dropzone" class="dropzone" tabindex="0">
        <div>
          <div class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 20h14"></path></svg>
          </div>
          <h2 id="uploadTitle">拖放文件到这里</h2>
          <p>支持多选上传<br>图片：JPG、PNG、GIF、WebP、SVG、BMP、ICO<br>音频：MP3、WAV、M4A、OGG、FLAC、AAC</p>
          <button id="chooseButton" class="button primary" type="button">选择文件</button>
          <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac">
        </div>
      </div>
      <div id="queue" class="queue" aria-live="polite"></div>
    </section>

    <section aria-labelledby="galleryTitle">
      <div class="gallery-head">
        <div>
          <h2 id="galleryTitle">图库</h2>
          <p id="fileCount">正在读取文件…</p>
        </div>
      </div>
      <div id="gallery" class="gallery" aria-live="polite"></div>
    </section>
  </main>

  <div id="toastStack" class="toast-stack" aria-live="assertive"></div>

  <script>
    const OWNER = 'yueshi211';
    const REPO = 'image-host';
    const BRANCH = 'main';
    const MEDIA_DIR = 'assets';
    const TOKEN_KEY = 'image-host.github-token';
    const IMAGE_EXTENSIONS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico']);
    const AUDIO_EXTENSIONS = new Set(['mp3', 'wav', 'm4a', 'ogg', 'flac', 'aac']);

    const tokenInput = document.querySelector('#tokenInput');
    const tokenStatus = document.querySelector('#tokenStatus');
    const saveTokenButton = document.querySelector('#saveTokenButton');
    const refreshButton = document.querySelector('#refreshButton');
    const chooseButton = document.querySelector('#chooseButton');
    const fileInput = document.querySelector('#fileInput');
    const dropzone = document.querySelector('#dropzone');
    const queue = document.querySelector('#queue');
    const gallery = document.querySelector('#gallery');
    const fileCount = document.querySelector('#fileCount');
    const toastStack = document.querySelector('#toastStack');

    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function updateTokenStatus() {
      const ready = Boolean(getToken());
      tokenStatus.classList.toggle('ready', ready);
      tokenStatus.querySelector('span:last-child').textContent = ready ? '已配置' : '未配置';
    }
    function toast(message, type = 'success') {
      const node = document.createElement('div');
      node.className = `toast ${type === 'error' ? 'error' : ''}`;
      node.textContent = message;
      toastStack.append(node);
      setTimeout(() => node.remove(), 3600);
    }
    function apiHeaders() {
      const token = getToken();
      const headers = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
      if (token) headers.Authorization = `Bearer ${token}`;
      return headers;
    }
    async function api(path, options = {}) {
      const response = await fetch(`https://api.github.com${path}`, {
        ...options,
        headers: { ...apiHeaders(), ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = '';
        try { detail = (await response.json()).message || ''; } catch (_) {}
        throw new Error(detail || `GitHub API 请求失败 (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    }
    function extension(name) { return name.split('.').pop().toLowerCase(); }
    function fileKind(name) {
      const ext = extension(name);
      if (IMAGE_EXTENSIONS.has(ext)) return 'image';
      if (AUDIO_EXTENSIONS.has(ext)) return 'audio';
      return null;
    }
    function safeName(name) {
      const parts = name.split('.');
      const ext = parts.length > 1 ? `.${parts.pop().toLowerCase()}` : '';
      const stem = parts.join('.').normalize('NFKC').replace(/[^a-zA-Z0-9\u4e00-\u9fff._-]+/g, '-').replace(/^-+|-+$/g, '') || 'file';
      return `${Date.now()}-${stem}${ext}`;
    }
    function githubPagesUrl(path) {
      return `https://${OWNER}.github.io/${REPO}/${path.split('/').map(encodeURIComponent).join('/')}`;
    }
    function fileToBase64(file, onProgress) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('无法读取本地文件'));
        reader.onprogress = event => { if (event.lengthComputable) onProgress(Math.round(event.loaded / event.total * 45)); };
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.readAsDataURL(file);
      });
    }
    function queueRow(file) {
      const row = document.createElement('div');
      row.className = 'queue-item';
      row.innerHTML = `<div><div class="queue-name"></div><div class="progress"><span></span></div></div><div class="queue-state">等待中</div>`;
      row.querySelector('.queue-name').textContent = file.name;
      queue.append(row);
      return {
        progress(value) { row.querySelector('.progress span').style.width = `${value}%`; },
        state(value) { row.querySelector('.queue-state').textContent = value; },
        done() { setTimeout(() => row.remove(), 1800); }
      };
    }
    async function uploadFile(file) {
      const kind = fileKind(file.name);
      const row = queueRow(file);
      if (!kind) { row.state('不支持'); row.done(); throw new Error(`${file.name} 的格式不受支持`); }
      if (!getToken()) { row.state('缺少 Token'); throw new Error('请先保存 GitHub Token'); }
      const targetName = safeName(file.name);
      const path = `${MEDIA_DIR}/${targetName}`;
      try {
        row.state('读取中');
        const content = await fileToBase64(file, value => row.progress(value));
        row.progress(55); row.state('上传中');
        await api(`/repos/${OWNER}/${REPO}/contents/${path}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Upload ${targetName}`, content, branch: BRANCH })
        });
        row.progress(100); row.state('已完成'); row.done();
        toast(`${file.name} 上传成功`);
      } catch (error) {
        row.state('失败');
        throw error;
      }
    }
    async function handleFiles(fileList) {
      const files = Array.from(fileList);
      if (!files.length) return;
      for (const file of files) {
        try { await uploadFile(file); } catch (error) { toast(error.message, 'error'); }
      }
      fileInput.value = '';
      await loadGallery();
    }
    function actionIcon(path) { return `<svg viewBox="0 0 24 24"><path d="${path}"></path></svg>`; }
    function createCard(file) {
      const kind = fileKind(file.name);
      const url = githubPagesUrl(file.path);
      const card = document.createElement('article');
      card.className = 'card';
      const preview = document.createElement('div');
      preview.className = `preview ${kind}`;
      if (kind === 'image') {
        const img = document.createElement('img');
        img.src = url; img.alt = file.name; img.loading = 'lazy';
        preview.append(img);
      } else {
        const audio = document.createElement('audio');
        audio.controls = true; audio.preload = 'metadata'; audio.src = url;
        preview.append(audio);
      }
      const body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML = `
        <p class="filename"></p>
        <div class="link-row"><input readonly aria-label="文件链接"><button class="icon-button copy" title="复制链接" aria-label="复制链接">${actionIcon('M9 9h10v10H9z M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1')}</button></div>
        <div class="actions"><button class="button copy">${actionIcon('M8 12h8 M12 8l4 4-4 4')}复制</button><button class="button open">${actionIcon('M14 3h7v7 M10 14 21 3 M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5')}打开</button><button class="icon-button danger delete" title="删除文件" aria-label="删除文件">${actionIcon('M3 6h18 M8 6V4h8v2 M19 6l-1 15H6L5 6 M10 11v6 M14 11v6')}</button></div>`;
      body.querySelector('.filename').textContent = file.name;
      body.querySelector('input').value = url;
      body.querySelectorAll('.copy').forEach(button => button.addEventListener('click', async () => {
        await navigator.clipboard.writeText(url); toast('链接已复制');
      }));
      body.querySelector('.open').addEventListener('click', () => window.open(url, '_blank', 'noopener'));
      body.querySelector('.delete').addEventListener('click', async () => {
        if (!getToken()) return toast('请先保存 GitHub Token', 'error');
        if (!confirm(`确定删除 ${file.name}？此操作会从 GitHub 仓库删除文件。`)) return;
        try {
          await api(`/repos/${OWNER}/${REPO}/contents/${file.path}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `Delete ${file.name}`, sha: file.sha, branch: BRANCH })
          });
          toast(`${file.name} 已删除`); await loadGallery();
        } catch (error) { toast(error.message, 'error'); }
      });
      card.append(preview, body);
      return card;
    }
    async function loadGallery() {
      refreshButton.disabled = true;
      fileCount.textContent = '正在读取文件…';
      gallery.innerHTML = '';
      try {
        let files = [];
        try { files = await api(`/repos/${OWNER}/${REPO}/contents/${MEDIA_DIR}?ref=${BRANCH}`); }
        catch (error) { if (!/Not Found/i.test(error.message)) throw error; }
        files = Array.isArray(files) ? files.filter(item => item.type === 'file' && fileKind(item.name)).reverse() : [];
        fileCount.textContent = `${files.length} 个文件`;
        if (!files.length) gallery.innerHTML = '<div class="empty">还没有文件，上传第一张图片或一段音频。</div>';
        else files.forEach(file => gallery.append(createCard(file)));
      } catch (error) {
        fileCount.textContent = '读取失败';
        gallery.innerHTML = '<div class="empty">无法读取图库，请检查网络或 Token。</div>';
        toast(error.message, 'error');
      } finally { refreshButton.disabled = false; }
    }

    saveTokenButton.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      if (!token) return toast('请输入 Token', 'error');
      localStorage.setItem(TOKEN_KEY, token);
      tokenInput.value = '';
      updateTokenStatus();
      toast('Token 已保存到本机浏览器');
      await loadGallery();
    });
    refreshButton.addEventListener('click', loadGallery);
    chooseButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', event => handleFiles(event.target.files));
    dropzone.addEventListener('click', event => { if (event.target === dropzone) fileInput.click(); });
    dropzone.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') fileInput.click(); });
    ['dragenter', 'dragover'].forEach(type => dropzone.addEventListener(type, event => { event.preventDefault(); dropzone.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach(type => dropzone.addEventListener(type, event => { event.preventDefault(); dropzone.classList.remove('dragging'); }));
    dropzone.addEventListener('drop', event => handleFiles(event.dataTransfer.files));

    updateTokenStatus();
    loadGallery();
  </script>
</body>
</html>
